<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scopeline — Apply for a pilot engagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .contact-wrap{max-width:620px;margin:0 auto;padding:64px 32px 100px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 7px;font-weight:600;}
  .field{margin-bottom:20px;}
  input,textarea{width:100%;background:#fff;border:1px solid rgba(16,23,42,.2);padding:12px 14px;
    color:var(--ink);font-family:inherit;font-size:14px;}
  input:focus,textarea:focus{outline:none;border-color:var(--coral);}
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a class="logo" href="index.html">Scopeline</a>
    <a href="index.html" style="font-size:14px;font-weight:500;">← Back home</a>
  </nav>
</header>

<main class="contact-wrap">
  <div class="eyebrow">Pilot program — limited spots</div>
  <h1 style="font-size:32px;margin:16px 0 14px;font-weight:800;letter-spacing:-.6px;">Apply for a pilot engagement</h1>
  <p style="color:var(--body);font-size:15px;line-height:1.7;margin:0 0 36px;">Tell us about the target. No testing starts until a signed authorization is in place — that's the next step after this.</p>

  <form onsubmit="return false;">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Jane Doe" autocomplete="name">
    </div>
    <div class="field">
      <label for="company">Company</label>
      <input id="company" name="company" type="text" placeholder="Company or project name" autocomplete="organization">
    </div>
    <div class="field">
      <label for="target">Target (URL or app name)</label>
      <input id="target" name="target" type="text" placeholder="https://yourapp.com">
    </div>
    <div class="field">
      <label for="msg">What do you want tested?</label>
      <textarea id="msg" name="msg" rows="4" placeholder="Web app, API, specific concerns…"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Submit application →</button>
  </form>
</main>

<footer>
  <div class="foot-inner" style="justify-content:center;">
    <small>© Scopeline — testing begins only after signed authorization.</small>
  </div>
</footer>
</body>
</html>
